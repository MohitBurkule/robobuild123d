name: fight-export
# Rebuild web/fight/robots/*.json for every robots/*/spec.json on dev, commit the result.
# Cloudflare Pages redeploys on that commit. Robots that fail to build are skipped.
on:
  push:
    branches: [dev]
    paths: ['robots/**', 'robot/**', 'src/**']
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: fight-export, cancel-in-progress: true }
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup/
        with:
          python-version: "3.13"
          optional-dependencies: "sim,development"
      - run: uv pip install trimesh manifold3d shapely rtree networkx pillow pyyaml
      - name: export robots
        run: |
          mkdir -p /tmp/rb
          for s in robots/*/spec.json; do
            PYTHONPATH=src:. timeout 600 python -m robot.fight.webexport "$s" --out /tmp/rb || echo "skip $s"
          done
          ls /tmp/rb
          if ls /tmp/rb/*.json >/dev/null 2>&1; then
            rm -f web/fight/robots/*.json
            cp /tmp/rb/*.json web/fight/robots/
            python - <<'PY'
          import json, glob, os
          ids = sorted(os.path.basename(p)[:-5] for p in glob.glob('web/fight/robots/*.json') if not p.endswith('index.json'))
          json.dump(ids, open('web/fight/robots/index.json', 'w'))
          PY
          fi
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add web/fight/robots
          git diff --cached --quiet || { git commit -m "fight: auto-export robots [skip ci]"; git pull --rebase origin dev; git push origin HEAD:dev; }
