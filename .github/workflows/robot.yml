name: robot

on:
  push:
    branches: [dev]
    paths: ["robot/**", "robots/**", "conftest.py", ".github/workflows/robot.yml"]
  pull_request:
    branches: [dev]
    paths: ["robot/**", "robots/**", "conftest.py", ".github/workflows/robot.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # nightly slow set (runs on the default branch)

permissions:
  contents: read

concurrency:
  group: robot-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast gate (not slow)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup/
        with:
          python-version: "3.13"
          optional-dependencies: "sim,development"
      - name: install robot extras
        run: uv pip install trimesh manifold3d shapely rtree networkx pillow pytest pytest-xdist pytest-timeout
      # two invocations: robot/tests and robots/revron/tests both have a test_joints.py (rootdir basename clash)
      - name: robot/tests
        run: python -m pytest robot/tests -m "not slow" -n 4 -q --timeout=600 --durations=25 -p no:cacheprovider
      - name: robots/revron/tests
        if: '!cancelled()'
        run: python -m pytest robots/revron/tests -m "not slow" -n 4 -q --timeout=600 --durations=25 -p no:cacheprovider
      - name: verify wedge_2wd (exit 2 = blockers)
        if: '!cancelled()'
        run: python -m robot verify robots/wedge_2wd/spec.json --fast

  slow:
    name: slow set
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup/
        with:
          python-version: "3.13"
          optional-dependencies: "sim,development"
      - name: install robot extras
        run: uv pip install trimesh manifold3d shapely rtree networkx pillow pytest pytest-xdist pytest-timeout
      # exit code 5 = no tests selected (the SLOW list in conftest.py may be empty): not a failure
      - name: robot/tests (slow)
        run: python -m pytest robot/tests -m slow -n 4 -q --timeout=3600 --durations=0 --durations-min=5 -p no:cacheprovider || [ $? -eq 5 ]
      - name: robots/revron/tests (slow)
        if: '!cancelled()'
        run: python -m pytest robots/revron/tests -m slow -n 4 -q --timeout=3600 --durations=0 --durations-min=5 -p no:cacheprovider || [ $? -eq 5 ]
