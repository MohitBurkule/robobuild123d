<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antweight Arena</title>
<style>
html,body{margin:0;height:100%;background:#0b0e14;color:#e6e9ef;font:15px system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#menu,#end{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#0b0e14e8}
#end{display:none;background:#0b0e14b0;font-size:28px}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
select,button,input{background:#1b2130;color:#e6e9ef;border:1px solid #3a4560;border-radius:6px;padding:8px 12px;font:inherit}
button{cursor:pointer;background:#2d5bff;border:0;font-weight:600}button.alt{background:#1b2130;border:1px solid #3a4560}
#hud{position:fixed;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;font-weight:600;text-shadow:0 1px 3px #000}
.bar{height:8px;background:#fff3;border-radius:4px;width:200px;margin-top:4px}.bar i{display:block;height:100%;border-radius:4px;transition:width .2s}
#help{position:fixed;bottom:8px;left:0;right:0;text-align:center;opacity:.6;font-size:13px}
small{opacity:.7}fieldset{border:1px solid #3a4560;border-radius:8px;display:flex;gap:6px}legend{opacity:.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div><span id="n0"></span><div class="bar"><i id="b0"></i></div></div><div id="tm" style="font-size:22px">90</div><div style="text-align:right"><span id="n1"></span><div class="bar"><i id="b1"></i></div></div></div>
<div id="help"></div>
<div id="end"><div id="endtxt"></div><div class="row"><button id="again">Rematch (R)</button><button class="alt" id="tomenu">Menu (Esc)</button></div></div>
<div id="menu"><h1 style="margin:0">Antweight Arena</h1><small>MuJoCo physics running in your browser · 150 g class</small>
<div class="row"><label>Mode <select id="mode"><option value="local">Local (this machine)</option><option value="host">Online: host a room</option><option value="join">Online: join a room</option></select></label>
<label>Arena <select id="arena"></select></label></div>
<div class="row"><fieldset><legend>Player 1</legend><select id="r0"></select> <select id="c0"><option value="human">Human</option><option value="ai">AI</option></select></fieldset>
<fieldset><legend>Player 2</legend><select id="r1"></select> <select id="c1"><option value="human">Human</option><option value="ai">AI</option></select></fieldset></div>
<div class="row" id="joinrow" style="display:none"><input id="code" placeholder="room code" size="6"><input id="srv" placeholder="server (blank = this site)" size="26"></div>
<div id="status" style="min-height:1.2em"></div>
<button id="go">Fight!</button>
<small id="keys">P1: W A S D drive · Space weapon (toggle spin, hold flipper) &nbsp;|&nbsp; P2: arrow keys · Enter weapon &nbsp;|&nbsp; Xbox pads: left stick + A/RT (optional) &nbsp;|&nbsp; R rematch</small></div>
<script type="module" src="game.js"></script></body></html>
